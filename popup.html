<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 420px;
      padding: 10px 12px;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #121212;
      color: #e0e0e0;
      margin: 0;
    }

    h2 {
      text-align: center;
      color: #00ff00;
      margin: 0 0 10px;
      font-size: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn {
      flex: 1;
      padding: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      border-radius: 5px;
      text-transform: uppercase;
      font-size: 10px;
      transition: opacity 0.2s;
      min-width: 0;
    }

    .btn:hover { opacity: 0.9; }

    .actions { display: flex; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }

    .hint {
      font-size: 10px;
      color: #666;
      text-align: center;
      margin: 0 0 10px;
      line-height: 1.35;
    }

    #mainContent {
      display: flex;
      flex-direction: column;
      min-height: 420px;
    }

    .home-dash {
      margin-top: 6px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: #1a1a1e;
      border: 1px solid #2a2a30;
      border-radius: 8px;
      padding: 10px 10px 8px;
      box-sizing: border-box;
    }

    .home-status {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid #2a2a30;
    }

    .home-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-top: 4px;
      flex-shrink: 0;
      background: #555;
    }

    .home-status-dot.on { background: #00e676; box-shadow: 0 0 6px rgba(0, 230, 118, 0.45); }
    .home-status-dot.pause { background: #ffc107; box-shadow: 0 0 6px rgba(255, 193, 7, 0.35); }
    .home-status-dot.idle { background: #616161; }

    .home-status-text { flex: 1; min-width: 0; }
    .home-status-line {
      font-size: 11px;
      font-weight: 600;
      color: #eee;
      line-height: 1.3;
    }
    .home-status-sub {
      font-size: 10px;
      color: #888;
      margin-top: 3px;
      line-height: 1.35;
      word-break: break-word;
    }

    .home-kpis {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-bottom: 8px;
    }

    .home-kpi {
      background: #141418;
      border-radius: 6px;
      padding: 8px 8px 6px;
      border: 1px solid #25252b;
    }

    .home-kpi-label {
      display: block;
      font-size: 9px;
      color: #777;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 4px;
    }

    .home-kpi-value {
      font-size: 14px;
      font-weight: 700;
      color: #b0e0ff;
      font-variant-numeric: tabular-nums;
    }

    .home-feed-wrap {
      flex: 1;
      min-height: 72px;
      display: flex;
      flex-direction: column;
      margin-bottom: 6px;
      overflow: hidden;
    }

    .home-feed-title {
      font-size: 9px;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    /* Новая панель событий по категориям */
    .ev-list {
      list-style: none;
      margin: 0;
      padding: 0;
      flex: 1;
      overflow: hidden;
    }

    .ev-item {
      display: flex;
      align-items: baseline;
      gap: 5px;
      padding: 3px 0;
      border-bottom: 1px solid #22222a;
      min-width: 0;
    }

    .ev-item:last-child { border-bottom: none; }

    .ev-time {
      font-size: 9px;
      color: #404040;
      white-space: nowrap;
      flex-shrink: 0;
      font-family: 'Consolas', monospace;
    }

    .ev-text {
      font-size: 10.5px;
      font-family: 'Consolas', 'Courier New', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
      color: #9e9e9e;
    }

    .ev-item.lv-success .ev-text { color: #4caf50; }
    .ev-item.lv-error   .ev-text { color: #cf6679; }
    .ev-item.lv-warn    .ev-text { color: #ff9800; }
    .ev-item.lv-sleep   .ev-text { color: #484848; }
    .ev-item.lv-info    .ev-text { color: #9e9e9e; }

    .ev-item.ev-fresh   .ev-text { color: #d0d0d0; }
    .ev-item.lv-success.ev-fresh .ev-text { color: #66bb6a; }
    .ev-item.lv-error.ev-fresh   .ev-text { color: #ef5350; }
    .ev-item.lv-warn.ev-fresh    .ev-text { color: #ffa726; }

    .ev-empty {
      color: #444;
      font-style: italic;
      font-size: 10px;
      padding: 6px 0;
    }

    .home-tip {
      margin: 0;
      font-size: 9px;
      color: #5c7a63;
      line-height: 1.4;
      padding-top: 6px;
      border-top: 1px solid #2a2a30;
    }
  </style>
</head>

<body>

  <div id="mainContent" style="display:none;">

  <h2>Playerok Bot</h2>
  <p class="hint">Старт/стоп и логи автовыдачи — в отдельном окне «Автовыдача».</p>

  <div class="actions">
    <button id="openFulfillBtn" class="btn" style="background: #00e676; color: #000;">⚡ Автовыдача</button>
    <button id="openBoostBtn" class="btn" style="background: #00c853; color: #000;">🚀 Автопубликация</button>
  </div>
  <div class="actions">
    <button id="openGeneratorBtn" class="btn" style="background: #2196F3; color: white;">🖼️ Редактор шаблонов</button>
    <button id="openPublisherBtn" class="btn" style="background: #9c27b0; color: white;">📝 Создание товаров</button>
  </div>
  <div class="actions">
    <button id="openHistoryBtn" class="btn" style="background: #ff9800; color: #000; flex: 1;">📋 История заказов</button>
    <button id="openDashboardBtn" class="btn" style="background: #00bcd4; color: #000; flex: 1;">📊 Сводка</button>
  </div>
 <section class="home-dash" id="homeDash" aria-label="Сводка и события">
    <div class="home-status">
      <span class="home-status-dot idle" id="homeStatusDot" aria-hidden="true"></span>
      <div class="home-status-text">
        <div class="home-status-line" id="homeStatusLine">Загрузка…</div>
        <div class="home-status-sub" id="homeStatusSub"></div>
      </div>
    </div>
    <div class="home-kpis">
      <div class="home-kpi">
        <span class="home-kpi-label">Выдач сегодня</span>
        <span class="home-kpi-value" id="kpiFulfill">—</span>
      </div>
      <div class="home-kpi">
        <span class="home-kpi-label" id="kpiBoostLabel">Бустов сегодня</span>
        <span class="home-kpi-value" id="kpiBoostToday">—</span>
      </div>
      <div class="home-kpi">
        <span class="home-kpi-label">Очередь / готово</span>
        <span class="home-kpi-value" id="kpiQueue">—</span>
      </div>
      <div class="home-kpi">
        <span class="home-kpi-label">В базе покупателей</span>
        <span class="home-kpi-value" id="kpiDb">—</span>
      </div>
    </div>
    <div class="home-feed-wrap">
      <div class="home-feed-title">Последние события</div>
      <ul class="ev-list" id="homeFeed"></ul>
    </div>
    <p class="home-tip" id="homeTip"></p>
  </section>
  </div><!-- /mainContent -->

  <script src="popup.js"></script>
</body>

</html>
